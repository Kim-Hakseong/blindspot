[project]
name = "blindspot"
version = "0.1.0"
description = "Find where your vision pipeline starts lying."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "opencv-python-headless==5.0.0.93",
    "numpy==2.2.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "pydantic==2.13.5",
    "typer==0.16.0",
]

[project.scripts]
blindspot = "blindspot.cli:app"

[dependency-groups]
infra = [
    "aws-cdk-lib==2.271.0",
    "constructs==10.8.1",
]
agent = [
    "mcp==2.2.0",
    "anthropic[bedrock]==1.8.0",
]
cloud = [
    "boto3==1.43.103",
]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "matplotlib==3.10.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blindspot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
